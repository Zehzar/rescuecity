<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RescueCity</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-bereich="leitstelle">

  <header class="kopf">
    <div class="logo">🚑 <span>RescueCity</span></div>
    <nav class="tabs">
      <button class="tab aktiv" data-ziel="leitstelle">Leitstelle</button>
      <button class="tab" data-ziel="quiz">Wissensquiz</button>
      <button class="tab" data-ziel="bestenliste">Bestenliste</button>
    </nav>
    <div class="spieler">
      <div class="spieler-name" id="spielerName" title="Spieler wechseln">–</div>
      <div class="spieler-level">
        <span id="spielerLevel">Lv 1</span>
        <div class="balken"><div id="levelBalken"></div></div>
      </div>
      <div class="werte">
        <span title="Währung zum Ausgeben">💶 <b id="geld">0</b></span>
        <span title="Gesamtpunkte für die Bestenliste">⭐ <b id="punkte">0</b></span>
      </div>
    </div>
  </header>

  <!-- ===================== LEITSTELLE ===================== -->
  <main id="leitstelle" class="bereich aktiv">
    <div class="karte-wrap">
      <div id="karte"></div>
      <div class="karten-werkzeug">
        <button id="bauModusBtn" class="btn primaer">＋ Wache bauen</button>
        <span id="bauHinweis" class="hinweis versteckt">Klicke auf die Karte, um die Wache zu platzieren. <a href="#" id="bauAbbrechen">Abbrechen</a></span>
      </div>
    </div>
    <aside class="seitenleiste" id="seitenleiste"></aside>
  </main>

  <!-- ===================== QUIZ ===================== -->
  <main id="quiz" class="bereich">
    <div class="quiz-karte" id="quizInhalt"></div>
  </main>

  <!-- ===================== BESTENLISTE ===================== -->
  <main id="bestenliste" class="bereich">
    <div class="liste-karte">
      <h2>Bestenliste</h2>
      <p class="klein" id="bestenHinweis">Alle Punkte aus Einsätzen und Quiz zählen. Die Liste zeigt alle Spieler auf diesem Gerät.</p>
      <table class="tabelle">
        <thead><tr><th>#</th><th>Spieler</th><th>Level</th><th>Punkte</th><th>Einsätze</th><th>Quiz richtig</th></tr></thead>
        <tbody id="bestenTabelle"></tbody>
      </table>
    </div>
  </main>

  <footer class="fuss"><a href="impressum.html" target="_blank">Impressum</a> · <a href="datenschutz.html" target="_blank">Datenschutz</a></footer>

  <!-- Dialog -->
  <div class="dialog-hg versteckt" id="dialogHg">
    <div class="dialog" id="dialog"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/questions.js"></script>
  <script src="vendor/supabase/supabase.js"></script>
  <script src="js/online.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
